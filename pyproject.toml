[project]
name = "personal-expense-tracker"
version = "1.0.0"
description = "Local-first expense tracking pipeline for Portuguese bank statements"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "João Pedro Oliveira" }]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# gui.py changes the working directory before importing project modules.
"expense_tracker/gui.py" = ["E402"]
